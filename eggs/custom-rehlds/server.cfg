// Servidor: Nome, Senha e Rcon
hostname ""
rcon_password ""
sv_password ""

// Configurações de Rede e Otimização ReHLDS/ReGameDLL
sys_ticrate "1000" // Define o FPS do servidor (ReHLDS usa sys_ticrate)
sv_maxrate "100000"
sv_minrate "25000"
sv_maxupdaterate "102"
sv_minupdaterate "30"
sv_maxunlag "1"

// Variáveis de Jogo (Gameplay)
mp_autoteambalance "1"
mp_buytime "0.25"
mp_c4timer "35"
mp_flashlight "1"
mp_footsteps "1"
mp_forcechasecam "0"
mp_forcecamera "0"
mp_freezetime "3"
mp_friendlyfire "0"
mp_hostagepenalty "0"
mp_limitteams "1"
mp_roundtime "2"
mp_timelimit "20"
mp_tkpunish "0"
sv_alltalk "1"     // Ajuda o plugin ReVoice a funcionar o mic geral
sv_gravity "800"
sv_maxspeed "320"

// Variáveis de Servidor
sv_allowdownload "1"
sv_allowupload "1"
sv_aim "0"
sv_cheats "0"
pausable "0"
sv_timeout "60"

// ReHLDS / Segurança Adicional (ReGameDLL_CS permite muitos controles granulares)
sv_rehlds_movecmdrate_max_avg "1500" // Limita flood de pacotes cmd
sv_rehlds_stringcmdrate_max_avg "250" // Limita flood de pacotes scripts

// Proteções contra erros do console
exec listip.cfg
exec banned.cfg
